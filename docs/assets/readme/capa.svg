    <text x="55" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="83" font-weight="700" letter-spacing="-5" fill="#b95735">miaupuração<tspan fill="#e7a966">.</tspan></text>
    <text x="62" y="294" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3c332e">De olho nos votos.</text>
    <text x="62" y="338" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3c332e">E no seu cursor.</text>
    <text x="63" y="390" font-family="Arial, sans-serif" font-size="18" fill="#76685f">Brasil inteiro no mapa. Tocantins sempre por perto.</text>

