  <title id="title">Miaupuração — de olho nos votos e no seu cursor</title>
  <desc id="desc">Capa em tons de creme e terracota. À esquerda, o nome do painel; à direita, um gatinho acompanha uma urna e a bandeira do Tocantins.</desc>
